<?xml version="1.0" encoding="UTF-8"?>
<!--
  Versio application icon - "Pair".

  Two plates of equal weight: the light one is the text mirror, the dark one is
  the binary project. The green disc sits in the gap and notches both - they
  currently agree. That is the product. The previous mark was three plates with
  a status badge on the top one, which said "version history, latest is healthy"
  - git's job, not Versio's.

  Colours are the app's own tokens (src/Versio.App/Theme/tokens/), so the icon
  and the UI cannot drift apart:

      #1D2026  Color.Surface.Base     tile
      #E8EAED  Color.Text.Primary     mirror (top)
      #5C6472  Color.Text.Disabled    project (bottom)
      #4ADE80  Color.Status.Added     agreement

  This file is the reference drawing, NOT the build input. The shipped icon is
  assets/versio.ico, produced by tools/New-VersioIcon.ps1, which redraws this
  geometry per size and uses a simplified variant below 48 px - at 16 px a
  14-unit plate is three and a half pixels, and the join turns to mush.

  THREE PLACES CARRY THIS GEOMETRY. Change one, change all three:

      assets/versio.svg                        this reference drawing
      tools/New-VersioIcon.ps1                 redraws it per icon size
      src/Versio.App/Theme/controls/Brand.xaml  the mark in the top bar, at 20 px

  Brand.xaml drops the tile and punches the badge notch in Surface.Base instead:
  inside a bar that is already that colour, the tile would be an invisible square
  with a visible edge. Run the script and look at the 16 px output, and open the
  app and look at the top bar, before believing a change to any of the three.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64"
     role="img" aria-label="Versio">
  <title>Versio</title>

  <rect width="64" height="64" rx="14" fill="#1D2026"/>

  <rect x="13" y="15" width="38" height="14" rx="4" fill="#E8EAED"/>
  <rect x="13" y="35" width="38" height="14" rx="4" fill="#5C6472"/>

  <!-- Punched in the tile colour so the badge reads as a notch cut out of both
       plates, not a sticker dropped on the gap. -->
  <circle cx="32" cy="32" r="8.5" fill="#1D2026"/>
  <circle cx="32" cy="32" r="6" fill="#4ADE80"/>
</svg>
