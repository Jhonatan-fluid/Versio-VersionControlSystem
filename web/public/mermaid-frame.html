<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- One Mermaid diagram, rendered inside a sandboxed frame (no same-origin: no cookies, no
         session, no reach into the page). The server gives this page alone a policy that allows
         Mermaid's inline <style>; see Http/Middleware.cs, FrameCsp. -->
    <title>Diagram</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      body { display: flex; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
      svg { max-width: 100%; height: auto; }
      .failed { color: #cf222e; font-size: 13px; padding: 8px; }
    </style>
    <script src="/assets/mermaid.js"></script>
    <script src="/mermaid-frame.js" defer></script>
  </head>
  <body></body>
</html>
